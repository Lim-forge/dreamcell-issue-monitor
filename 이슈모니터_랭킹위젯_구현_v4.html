<!--
  이슈모니터(dreamcell-issue-monitor) 종합 개선 스크립트 v4 (최종본)

  ================= v3 → v4 변경점 =================
  1. 담당자별 랭킹을 "요약보기" 카드 하나로 축소
     - v3까지는 랭킹 카드가 항상 넓게 펼쳐진 채로 KPI 줄 옆/아래에 있었음
     - v4는 다른 KPI 카드와 완전히 같은 크기의 "요약보기" 카드 1개만 기본으로 보이고,
       클릭하면 그 자리에서 카드가 넓어지며 담당자별 랭킹(최대 10명 + "+N명")이 가로 한 줄로 펼쳐짐
       (10명 넘게 잡히는 폭이면 가로 스크롤로 처리)
     - "접기" 클릭 시 다시 원래 크기의 "요약보기" 카드로 복귀
     - 펼침/접힘 전환 시 부드러운 페이드 애니메이션 적용
  2. 월 선택 시 "적용" 버튼 없이 즉시 반영
     - 연도/월 select의 change 이벤트에 기존 applyYM(tab) 함수를 바로 연결
     - 5개 탭(10%미만 출고건/수주건, 반품처리건, 수주취소·변경건, 미출고내역) 전부 동일 적용
  3. 페이지 진입 시 항상 "실제 데이터가 있는 마지막 월"을 기본으로 표시
     - 각 탭의 날짜 컬럼(ship_date/order_date/return_date, cc는 report_month)에서
       실시간으로 최댓값을 조회해서 연도/월 select에 반영 후 자동 조회
     - 데이터가 없는 탭(예: 미출고내역이 아직 비어있는 경우)은 건드리지 않고 기존 기본값 유지
  4. "KPI 요약" 배너 접기/펼치기도 부드러운 애니메이션으로 전환
     - 기존엔 display:none으로 뚝 끊기듯 사라졌는데, max-height/opacity 전환으로 매끄럽게 바뀜

  ================= 붙여넣는 방법 =================
  index.html에 이전 버전(v1/v2/v3) 스크립트가 있다면 그 <script> 블록을 통째로 지우고
  이 파일의 <script>~</script>를 </body> 바로 앞에 넣어줘. 그 다음 git commit + push.

  ================= 알아둘 것 (제약 사항) =================
  - 반품처리건 탭에는 담당자 검색창이 원래 없어서 스크립트가 자동으로 하나 추가함 (ret-rep)
  - 데이터가 0건인 탭은 "요약보기" 카드 자체가 생기지 않음 (정상 동작)
  - "최저 마진율" 카드 클릭 시 실제 해당 행으로 스크롤+하이라이트 이동 (10%미만 출고건/수주건 탭 한정)
  - 사이드바 아이콘 SVG 교체, 출고건 화살표 방향 수정(↑→↓), 상단 죽은 "조회" 버튼 제거 포함
-->
<script>
(function(){
  const RANK_CFG = {
    lms: { table:'low_margin_shipments', dateField:'ship_date', repField:'rep',
           gridId:'kpi-grid-lms', repInputId:'lms-rep', yrId:'ym-yr-lms', moId:'ym-mo-lms',
           goSel:'#va-lms .btn-p', metric:'margin', marginField:'margin_rate' },
    lmo: { table:'orders', dateField:'order_date', repField:'orderer',
           gridId:'kpi-grid-lmo', repInputId:'lmo-rep', yrId:'ym-yr-lmo', moId:'ym-mo-lmo',
           goSel:'#va-lmo .btn-p', metric:'margin', marginField:'margin_rate' },
    ret: { table:'return_shipments', dateField:'return_date', repField:'rep',
           gridId:'kpi-grid-ret', repInputId:'ret-rep', yrId:'ym-yr-ret', moId:'ym-mo-ret',
           goSel:'#va-ret .btn-p', metric:'amount', amtField:'total' },
    ush: { table:'unshipped', dateField:'order_date', repField:'rep',
           gridId:'kpi-grid-ush', repInputId:'ush-rep', yrId:'ym-yr-ush', moId:'ym-mo-ush',
           goSel:'#va-ush .btn-p', metric:'months', monthsField:'active_months' }
  };

  function ensureRetRepInput(){
    if(document.getElementById('ret-rep')) return;
    const c = document.getElementById('ret-cust');
    if(!c) return;
    const i = document.createElement('input');
    i.className = 'fi'; i.id = 'ret-rep'; i.placeholder = '담당자'; i.style.width = '90px';
    c.parentElement.insertBefore(i, c);
  }

  async function fetchYearRows(cfg){
    const yrEl = document.getElementById(cfg.yrId);
    const yr = (yrEl && yrEl.value) || String(new Date().getFullYear());
    const from = yr + '-01-01';
    const to = (Number(yr) + 1) + '-01-01';
    const { data, error } = await sb.from(cfg.table).select('*')
      .gte(cfg.dateField, from).lt(cfg.dateField, to);
    if(error){ console.error('[랭킹위젯]', cfg.table, error); return []; }
    return data || [];
  }

  function aggregate(rows, cfg){
    const map = new Map();
    rows.forEach(r=>{
      const name = (r[cfg.repField] || '').trim();
      if(!name) return;
      if(!map.has(name)) map.set(name, { name, cnt:0, marginSum:0, amt:0, monthsSet:new Set() });
      const g = map.get(name);
      g.cnt++;
      if(cfg.metric === 'margin' && typeof r[cfg.marginField] === 'number') g.marginSum += r[cfg.marginField];
      if(cfg.metric === 'amount' && typeof r[cfg.amtField] === 'number') g.amt += r[cfg.amtField];
      if(cfg.metric === 'months' && Array.isArray(r[cfg.monthsField])) r[cfg.monthsField].forEach(m=>g.monthsSet.add(m));
    });
    const list = [...map.values()].map(g=>{
      let sub = '';
      if(cfg.metric === 'margin') sub = (g.cnt ? (g.marginSum/g.cnt).toFixed(1) : '0') + '%';
      else if(cfg.metric === 'amount') sub = Math.round(g.amt).toLocaleString() + '원';
      else if(cfg.metric === 'months') sub = g.monthsSet.size + '개월';
      return { name: g.name, cnt: g.cnt, sub };
    });
    list.sort((a,b) => b.cnt - a.cnt);
    return list;
  }

  function drillDown(cfg, name){
    if(cfg.table === 'return_shipments') ensureRetRepInput();
    const yrEl = document.getElementById(cfg.yrId);
    const moEl = document.getElementById(cfg.moId);
    const repEl = document.getElementById(cfg.repInputId);
    if(yrEl) yrEl.value = String(new Date().getFullYear());
    if(moEl) moEl.value = '';
    if(repEl) repEl.value = name;
    const goBtn = document.querySelector(cfg.goSel);
    if(goBtn) goBtn.click();
  }

  function entryHtml(it, i){
    return '<div class="rank-entry" data-name="' + it.name.replace(/"/g,'&quot;') + '" ' +
      'style="cursor:pointer;padding:3px 8px;border-radius:5px;flex:0 0 auto;">' +
      '<div style="font-size:14px;font-weight:900;white-space:nowrap;">' +
      (i+1) + '위 ' + it.name + '</div>' +
      '<div style="font-size:12px;color:#c2410c;font-weight:700;white-space:nowrap;">' + it.cnt + '건·' + it.sub + '</div></div>';
  }

  function ensureCard(tab, cfg){
    const grid = document.getElementById(cfg.gridId);
    if(!grid) return null;
    let host = document.getElementById('rankcard-' + tab);
    if(!host){
      host = document.createElement('div');
      host.id = 'rankcard-' + tab;
      host.className = 'kpi-card';
      host.style.cursor = 'pointer';
      host.dataset.expanded = '0';
      host.innerHTML = '<div class="rank-inner"></div>';
      grid.appendChild(host);
    }
    return host;
  }

  function paintCollapsed(host){
    const inner = host.querySelector('.rank-inner');
    inner.classList.add('fading');
    setTimeout(()=>{
      host.style.gridColumn = '';
      inner.innerHTML =
        '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:4px;">' +
        '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="rgb(139,154,174)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>' +
        '<div style="font-size:12px;color:rgb(139,154,174);font-weight:700;">요약보기</div></div>';
      inner.classList.remove('fading');
    }, 180);
  }

  function paintExpanded(host, cfg, list){
    const inner = host.querySelector('.rank-inner');
    inner.classList.add('fading');
    setTimeout(()=>{
      host.style.gridColumn = 'span 3';
      inner.innerHTML =
        '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">' +
        '<span style="font-size:10px;color:rgb(139,154,174);">담당자별 발생 빈도 · 올해</span>' +
        '<span class="rank-close" style="font-size:11px;color:rgb(139,154,174);cursor:pointer;">접기 ▲</span></div>' +
        '<div style="display:flex;flex-wrap:nowrap;overflow-x:auto;gap:6px;">' +
        list.slice(0,10).map((it,i) => entryHtml(it,i)).join('') +
        (list.length > 10 ?
          '<div style="display:flex;align-items:center;font-size:11px;color:rgb(139,154,174);flex:0 0 auto;">+' +
          (list.length - 10) + '명</div>' : '') +
        '</div>';
      inner.querySelectorAll('.rank-entry').forEach(el=>{
        el.addEventListener('click', (e)=>{ e.stopPropagation(); drillDown(cfg, el.dataset.name); });
      });
      const closeEl = inner.querySelector('.rank-close');
      if(closeEl) closeEl.addEventListener('click', (e)=>{
        e.stopPropagation();
        host.dataset.expanded = '0';
        paintCollapsed(host);
      });
      inner.classList.remove('fading');
    }, 180);
  }

  async function refreshRank(tab){
    const cfg = RANK_CFG[tab];
    if(!cfg) return;
    if(cfg.table === 'return_shipments') ensureRetRepInput();
    const rows = await fetchYearRows(cfg);
    const list = aggregate(rows, cfg);
    const host = ensureCard(tab, cfg);
    if(!host) return;
    if(list.length === 0){ host.remove(); return; }
    host.__list = list;
    if(host.dataset.expanded === '1') paintExpanded(host, cfg, list);
    else paintCollapsed(host);
    host.onclick = ()=>{
      if(host.dataset.expanded === '1') return;
      host.dataset.expanded = '1';
      paintExpanded(host, cfg, host.__list);
    };
  }

  const HOOK_MAP = { loadLMS:'lms', loadRET:'ret', loadLMO:'lmo', loadUSH:'ush' };
  Object.keys(HOOK_MAP).forEach(fnName=>{
    const tab = HOOK_MAP[fnName];
    const orig = window[fnName];
    if(typeof orig !== 'function'){
      console.warn('[랭킹위젯] ' + fnName + ' 함수를 찾지 못했어요.');
      return;
    }
    window[fnName] = async function(...args){
      const r = await orig.apply(this, args);
      refreshRank(tab);
      return r;
    };
  });

  window.addEventListener('load', ()=>{
    setTimeout(()=>{ Object.keys(RANK_CFG).forEach(refreshRank); }, 800);
  });

  // "최저 마진율" 카드 클릭 시 실제 해당 행으로 스크롤 + 하이라이트 이동
  function attachMinMarginJump(panelId, minCardValId){
    const kv = document.getElementById(minCardValId);
    if(!kv) return;
    const card = kv.closest('.kpi-card');
    if(!card) return;
    card.style.cursor = 'pointer';
    card.onclick = () => {
      const panel = document.getElementById(panelId);
      if(!panel) return;
      const table = Array.from(panel.querySelectorAll('table')).find(t => t.rows.length > 3);
      if(!table) return;
      const headerCells = Array.from(table.rows[0].cells).map(c => c.textContent.trim());
      const colIdx = headerCells.findIndex(h => h.includes('마진율'));
      if(colIdx < 0) return;
      let minRow = null, minVal = Infinity;
      Array.from(table.querySelectorAll('tr[data-id]')).forEach(tr=>{
        const cell = tr.cells[colIdx];
        if(!cell) return;
        const val = parseFloat(cell.textContent.replace('%','').replace(',',''));
        if(!isNaN(val) && val < minVal){ minVal = val; minRow = tr; }
      });
      if(minRow){
        minRow.scrollIntoView({ behavior:'smooth', block:'center' });
        minRow.style.transition = 'background-color 0.5s';
        minRow.style.backgroundColor = '#fff3cd';
        setTimeout(()=>{ minRow.style.backgroundColor = ''; }, 2500);
      }
    };
  }
  window.addEventListener('load', ()=>{
    setTimeout(()=>{
      attachMinMarginJump('panel-lms', 'kv-lms-min');
      attachMinMarginJump('panel-lmo', 'kv-lmo-min');
    }, 800);
  });

  // 사이드바 이모지/텍스트 아이콘 → SVG 라인 아이콘 교체, 출고건 방향 오류 수정, 죽은 상단 버튼 제거
  function cleanupUI(){
    ['mbv-lms','mbv-ret','mbv-cc','mbv-lmo','mbv-ush'].forEach(id=>{
      const b = document.getElementById(id);
      if(b) b.remove();
    });
    const ICONS = {
      'nav-lms': '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 18 13.5 8.5 8.5 13.5 1 6"/><polyline points="17 18 23 18 23 12"/></svg>',
      'nav-lmo': '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 18 13.5 8.5 8.5 13.5 1 6"/><polyline points="17 18 23 18 23 12"/></svg>',
      'nav-ret': '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 14 4 9 9 4"/><path d="M20 20v-7a4 4 0 0 0-4-4H4"/></svg>',
      'nav-cc': '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>',
      'nav-ush': '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>'
    };
    Object.keys(ICONS).forEach(navId=>{
      const el = document.getElementById(navId);
      if(!el) return;
      const icSpan = el.querySelector('.nic');
      if(icSpan){
        icSpan.innerHTML = ICONS[navId];
        icSpan.style.display = 'inline-flex';
        icSpan.style.alignItems = 'center';
      }
    });
  }
  window.addEventListener('load', ()=>{ setTimeout(cleanupUI, 800); });

  // 월 선택 시 "적용" 없이 즉시 반영 + 진입 시 실제 데이터가 있는 마지막 월을 기본값으로
  function attachAutoApply(){
    ['lms','ret','cc','lmo','ush'].forEach(tab=>{
      ['ym-yr-' + tab, 'ym-mo-' + tab].forEach(id=>{
        const el = document.getElementById(id);
        if(!el) return;
        el.addEventListener('change', ()=>{
          if(typeof window.applyYM === 'function') window.applyYM(tab);
        });
      });
    });
  }

  function applyDefaultMonth(tab, ym){
    if(!ym) return;
    const [yr, mo] = ym.split('-');
    const yrEl = document.getElementById('ym-yr-' + tab);
    const moEl = document.getElementById('ym-mo-' + tab);
    if(yrEl) yrEl.value = yr;
    if(moEl) moEl.value = String(Number(mo));
    if(typeof window.applyYM === 'function') window.applyYM(tab);
  }

  async function setDefaultMonths(){
    const dateFieldMap = {
      lms: { table:'low_margin_shipments', field:'ship_date' },
      ret: { table:'return_shipments', field:'return_date' },
      lmo: { table:'orders', field:'order_date' },
      ush: { table:'unshipped', field:'order_date' }
    };
    for(const tab of Object.keys(dateFieldMap)){
      const { table, field } = dateFieldMap[tab];
      try{
        const { data, error } = await sb.from(table).select(field).order(field, { ascending:false }).limit(1);
        if(error || !data || !data[0]) continue;
        applyDefaultMonth(tab, String(data[0][field]).slice(0,7));
      }catch(e){ console.warn('[기본월설정]', tab, e); }
    }
    try{
      const { data } = await sb.from('sales_report_summary').select('report_month').order('report_month', { ascending:false }).limit(1);
      if(data && data[0]) applyDefaultMonth('cc', data[0].report_month);
    }catch(e){ console.warn('[기본월설정] cc', e); }
  }

  window.addEventListener('load', ()=>{
    setTimeout(()=>{
      attachAutoApply();
      setDefaultMonths();
    }, 800);
  });

  // 모든 아코디언(요약보기 카드, KPI 요약 배너)에 부드러운 전환 애니메이션 적용
  function attachSmoothAccordions(){
    if(document.getElementById('smooth-accordion-style')) return;
    const st = document.createElement('style');
    st.id = 'smooth-accordion-style';
    st.textContent =
      '.rank-inner{ transition: opacity .2s ease; }' +
      '.rank-inner.fading{ opacity:0; }' +
      '.kpi-grid{ transition: max-height .32s ease, opacity .28s ease, margin-top .32s ease !important; overflow:hidden !important; }' +
      '.kpi-grid:not(.open){ display:flex !important; max-height:0 !important; opacity:0 !important; margin-top:-10px !important; pointer-events:none !important; }' +
      '.kpi-grid.open{ max-height:700px !important; opacity:1 !important; margin-top:10px !important; }';
    document.head.appendChild(st);
  }
  attachSmoothAccordions();
})();
</script>
